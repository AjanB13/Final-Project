<!-- Frutex Recommendation Chatbot -->
<style>
.fx-chat-btn{position:fixed;bottom:24px;right:24px;z-index:9999;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#c8963e,#a07828);border:none;cursor:pointer;box-shadow:0 4px 20px rgba(200,150,62,.4);display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform .3s}
.fx-chat-btn:hover{transform:scale(1.1)}
.fx-chat-box{position:fixed;bottom:90px;right:24px;z-index:9999;width:340px;max-height:480px;background:#fff;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.15);display:none;flex-direction:column;overflow:hidden}
.fx-chat-box.open{display:flex}
.fx-chat-header{background:linear-gradient(135deg,#c8963e,#a07828);color:#fff;padding:14px 16px;font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:8px}
.fx-chat-body{flex:1;overflow-y:auto;padding:12px;max-height:320px;display:flex;flex-direction:column;gap:8px}
.fx-chat-body .msg{max-width:85%;padding:10px 14px;border-radius:14px;font-size:.82rem;line-height:1.5}
.fx-chat-body .msg.bot{background:#f5f3ee;color:#1a1a1a;align-self:flex-start;border-bottom-left-radius:4px}
.fx-chat-body .msg.user{background:#c8963e;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.fx-chat-body .msg .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fx-chat-body .msg .btns button{background:#c8963e;color:#fff;border:none;padding:6px 12px;border-radius:20px;font-size:.75rem;cursor:pointer;transition:background .2s}
.fx-chat-body .msg .btns button:hover{background:#a07828}
.fx-chat-input{display:flex;border-top:1px solid #eee;padding:8px}
.fx-chat-input input{flex:1;border:none;outline:none;padding:8px;font-size:.82rem;font-family:Inter}
.fx-chat-input button{background:#c8963e;color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
</style>

<div class="fx-chat-btn" id="fxChatBtn" onclick="toggleChat()">💬</div>
<div class="fx-chat-box" id="fxChatBox">
  <div class="fx-chat-header">🥤 Frutex Bot — Drink Recommendations</div>
  <div class="fx-chat-body" id="fxChatBody"></div>
  <div class="fx-chat-input">
    <input id="fxChatInput" placeholder="Type something..." onkeypress="if(event.key==='Enter')sendMsg()">
    <button onclick="sendMsg()">Send</button>
  </div>
</div>

<script>
var fxStep=0,fxAnswers={};
function toggleChat(){
  var b=document.getElementById('fxChatBox');b.classList.toggle('open');
  if(b.classList.contains('open')&&fxStep===0)startBot();
}
function startBot(){
  fxStep=1;fxAnswers={};
  addMsg('bot','Hi! I\'m the Frutex recommendation bot. What kind of drink are you looking for?<div class="btns"><button onclick="quickReply(\'Energy boost\')">⚡ Energy boost</button><button onclick="quickReply(\'Relax & calm\')">🧘 Relax & calm</button><button onclick="quickReply(\'Healthy & natural\')">🌿 Healthy & natural</button><button onclick="quickReply(\'Zero sugar\')">0️⃣ Zero sugar</button></div>');
}
function quickReply(a){addMsg('user',a);fxAnswers.mood=a;askNext();}
function askNext(){
  if(fxStep===1){fxStep=2;addMsg('bot','Great choice! Do you prefer fruity or classic flavors?<div class="btns"><button onclick="quickReply2(\'Fruity\')">🍓 Fruity</button><button onclick="quickReply2(\'Classic\')">🥤 Classic</button><button onclick="quickReply2(\'Bold/Strong\')">💪 Bold/Strong</button></div>');}
  else if(fxStep===2){fxStep=3;addMsg('bot','One last question — do you need caffeine?<div class="btns"><button onclick="quickReply3(\'Yes\')">☕ Yes, caffeine</button><button onclick="quickReply3(\'No\')">🚫 No caffeine</button><button onclick="quickReply3(\'Doesnt matter\')">🤷 Doesn\'t matter</button></div>');}
}
function quickReply2(a){addMsg('user',a);fxAnswers.flavor=a;askNext();}
function quickReply3(a){addMsg('user',a);fxAnswers.caffeine=a;giveRecommendation();}
function giveRecommendation(){
  var m=fxAnswers.mood||'',f=fxAnswers.flavor||'',c=fxAnswers.caffeine||'';
  var drink='',why='',page='';
  if(m.indexOf('Energy')>=0){
    if(c==='No'){drink='Zero Caffeine Edition of Golden Eagle';why='All the bold flavor with zero caffeine';page='golden-eagle.html';}
    else{drink='Golden Eagle Classic';why='Our #1 energy drink with 160mg caffeine';page='golden-eagle.html';}
  }else if(m.indexOf('Relax')>=0){
    if(f.indexOf('Fruity')>=0){drink='Relax Mango or Relax Blueberry';why='Fruity, soothing, caffeine-free herbal blends';page='relax.html';}
    else{drink='Relax Apple or Relax Ice Tea';why='Classic calming drinks with no caffeine';page='relax.html';}
  }else if(m.indexOf('Healthy')>=0||m.indexOf('Natural')>=0){
    if(f.indexOf('Fruity')>=0){drink='Natural Strawberry or Natural Sour Cherry';why='Real fruit juice, spring water, pure taste';page='natural.html';}
    else{drink='Natural Apple or Natural Pear';why='Crisp, mellow, 100% natural goodness';page='natural.html';}
  }else if(m.indexOf('Zero')>=0||m.indexOf('sugar')>=0){
    drink='Zeros Original';why='Zero sugar, zero caffeine, 100% natural taste';page='zeros.html';
  }
  addMsg('bot','I recommend: <strong>'+drink+'</strong> 🎉<br>'+why+'<br><br><a href="'+page+'" style="color:#c8963e;font-weight:700">👉 View this drink →</a><br><br><button onclick="startBot()" style="background:#eee;border:none;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:.75rem">🔄 Start over</button>');
  fxStep=0;
}
function addMsg(type,text){
  var b=document.getElementById('fxChatBody');
  var d=document.createElement('div');d.className='msg '+type;d.innerHTML=text;
  b.appendChild(d);b.scrollTop=b.scrollHeight;
}
function sendMsg(){
  var inp=document.getElementById('fxChatInput'),t=inp.value.trim();
  if(!t)return;
  addMsg('user',t);inp.value='';
  if(fxStep===0){
    if(t.toLowerCase().indexOf('energy')>=0)quickReply('Energy boost');
    else if(t.toLowerCase().indexOf('relax')>=0||t.toLowerCase().indexOf('calm')>=0)quickReply('Relax & calm');
    else if(t.toLowerCase().indexOf('health')>=0||t.toLowerCase().indexOf('natural')>=0)quickReply('Healthy & natural');
    else if(t.toLowerCase().indexOf('zero')>=0||t.toLowerCase().indexOf('sugar')>=0)quickReply('Zero sugar');
    else addMsg('bot','I can help you find the perfect Frutex drink! Try saying "energy", "relax", "natural", or "zero sugar".');
  }
}
</script>
