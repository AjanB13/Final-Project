<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Frutex</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#f7f5f0;--card:#fff;--t1:#1a1a1a;--t2:#5a5a5a;--t3:#8a8a8a;--g:#c8963e;--gl:#d4a843;--gd:#a07828;--mx:1200px;--tr:.3s cubic-bezier(.4,0,.2,1);--r:12px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Inter,system-ui;background:var(--bg);color:var(--t1);min-height:100vh;display:flex;flex-direction:column}
    nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,.06)}
    .ni{max-width:var(--mx);margin:0 auto;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px}
    .nl{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:900;color:var(--g);letter-spacing:1px;text-decoration:none}
    .nv{display:flex;gap:2rem;list-style:none}
    .nv a{color:var(--t2);text-decoration:none;font-size:.9rem;font-weight:500;position:relative;transition:color var(--tr)}
    .nv a::after{content:'';position:absolute;bottom:-4px;left:0;right:100%;height:2px;background:var(--g);transition:right var(--tr)}
    .nv a:hover{color:var(--gl)}.nv a:hover::after{right:0}.nv a.active{color:var(--gl);border-bottom:2px solid var(--g);padding-bottom:2px}

    .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:100px 1rem 2rem}
    .box{background:var(--card);border:1px solid rgba(0,0,0,.06);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.06);padding:2.5rem;width:100%;max-width:400px}
    .box h2{font-family:'Playfair Display',serif;font-size:1.6rem;text-align:center;margin-bottom:.3rem}
    .box .sub{text-align:center;color:var(--t2);font-size:.82rem;margin-bottom:1.5rem}

    .tabs{display:flex;gap:0;margin-bottom:1.5rem;border-radius:8px;overflow:hidden;border:1px solid rgba(0,0,0,.08)}
    .tabs button{flex:1;padding:.6rem;border:none;background:#f0ede6;color:var(--t2);font-size:.82rem;font-weight:600;cursor:pointer;transition:background var(--tr),color var(--tr)}
    .tabs button.active{background:var(--g);color:#fff}

    label{display:block;font-size:.75rem;font-weight:600;color:var(--t2);margin-bottom:.3rem;margin-top:1rem}
    input{width:100%;padding:.7rem .9rem;border:1px solid rgba(0,0,0,.1);border-radius:8px;font-size:.9rem;font-family:Inter;transition:border-color var(--tr);outline:none}
    input:focus{border-color:var(--g)}
    .btn{width:100%;padding:.75rem;margin-top:1.5rem;background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;font-weight:700;font-size:.95rem;border:none;border-radius:8px;cursor:pointer;transition:transform var(--tr),box-shadow var(--tr)}
    .btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(200,150,62,.3)}

    .msg{text-align:center;font-size:.78rem;margin-top:.8rem;padding:.5rem;border-radius:6px;display:none}
    .msg.error{display:block;background:#fde8e8;color:#b91c1c}
    .msg.success{display:block;background:#e8f5e9;color:#1b5e20}

    .user-bar{margin-top:1.5rem;padding-top:1.2rem;border-top:1px solid rgba(0,0,0,.06);display:none}
    .user-bar.show{display:block}
    .user-bar p{font-size:.82rem;color:var(--t2);text-align:center;margin-bottom:.6rem}
    .btn-out{width:100%;padding:.55rem;background:none;border:1px solid rgba(0,0,0,.1);border-radius:8px;color:var(--t2);font-size:.8rem;cursor:pointer;transition:background var(--tr)}
    .btn-out:hover{background:rgba(0,0,0,.03)}
  </style>
</head>
<body>

<nav><div class="ni">
  <a href="index.html" class="nl">FRUTEX</a>
  <ul class="nv">
    <li><a href="index.html">Home</a></li><li><a href="index.html#about">About</a></li>
    <li><a href="index.html#products">Products</a></li><li><a href="golden-eagle.html">Flavours</a></li>
    <li><a href="natural.html">Natural</a></li><li><a href="relax.html">Relax</a></li>
    <li><a href="zeros.html">Zeros</a></li><li><a href="rush.html">Game</a></li>
    <li><a href="login.html" class="active">Login</a></li>
  </ul>
</div></nav>

<div class="wrap">
  <div class="box">
    <h2>Welcome to Frutex</h2>
    <p class="sub">Sign in or create an account</p>

    <div class="tabs">
      <button id="tabLogin" class="active" onclick="switchTab('login')">Sign In</button>
      <button id="tabSignup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- Sign In Form -->
    <form id="formLogin" onsubmit="handleLogin(event)">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@email.com" required>
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="••••••••" required>
      <div class="msg" id="loginMsg"></div>
      <button class="btn" type="submit">Sign In</button>
    </form>

    <!-- Sign Up Form -->
    <form id="formSignup" style="display:none" onsubmit="handleSignup(event)">
      <label>Full Name</label>
      <input type="text" id="signupName" placeholder="Your name" required>
      <label>Email</label>
      <input type="email" id="signupEmail" placeholder="you@email.com" required>
      <label>Password</label>
      <input type="password" id="signupPass" placeholder="Min 6 characters" minlength="6" required>
      <div class="msg" id="signupMsg"></div>
      <button class="btn" type="submit">Create Account</button>
    </form>

    <!-- Logged In Bar -->
    <div class="user-bar" id="userBar">
      <p>Signed in as <strong id="userName">—</strong></p>
      <button class="btn-out" onclick="handleLogout()">Sign Out</button>
    </div>
  </div>
</div>

<script>
  var SUPABASE_URL = 'https://sdtplxysseavaoubidec.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkdHBseHlzc2VhdmFvdWJpZGVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxMzEyMzQsImV4cCI6MjEwMDcwNzIzNH0.cSwyPPoHGZZbd9YHBSF4CQgL_RM-FsBO7DE1vJ_Z--c';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Check existing session
  sb.auth.getSession().then(function(r){
    if(r.data.session){ showUser(r.data.session.user); }
  });

  function switchTab(t){
    document.getElementById('tabLogin').classList.toggle('active', t==='login');
    document.getElementById('tabSignup').classList.toggle('active', t==='signup');
    document.getElementById('formLogin').style.display = t==='login'?'':'none';
    document.getElementById('formSignup').style.display = t==='signup'?'':'none';
  }

  function showMsg(id, text, type){
    var m=document.getElementById(id); m.textContent=text; m.className='msg '+type;
    setTimeout(function(){m.className='msg'}, 4000);
  }

  async function handleLogin(e){
    e.preventDefault();
    var em=document.getElementById('loginEmail').value;
    var pw=document.getElementById('loginPass').value;
    var r=await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error){ showMsg('loginMsg', r.error.message, 'error'); }
    else{ showUser(r.data.user); showMsg('loginMsg', 'Signed in!', 'success'); }
  }

  async function handleSignup(e){
    e.preventDefault();
    var nm=document.getElementById('signupName').value;
    var em=document.getElementById('signupEmail').value;
    var pw=document.getElementById('signupPass').value;
    var r=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:nm}}});
    if(r.error){
      var emsg=r.error.message;
      if(r.error.status===429) emsg='Too many attempts. Wait a minute and try again.';
      else if(emsg.includes('rate limit')) emsg='Rate limit reached — try again in 60 seconds.';
      showMsg('signupMsg', emsg, 'error');
    }
    else{ showMsg('signupMsg', 'Check your email to confirm!', 'success'); }
  }

  function showUser(user){
    document.getElementById('userBar').classList.add('show');
    document.getElementById('userName').textContent = user.user_metadata?.full_name || user.email;
    document.getElementById('formLogin').style.display='none';
    document.getElementById('formSignup').style.display='none';
    document.querySelector('.tabs').style.display='none';
  }

  async function handleLogout(){
    await sb.auth.signOut();
    document.getElementById('userBar').classList.remove('show');
    document.getElementById('formLogin').style.display='';
    document.querySelector('.tabs').style.display='flex';
    switchTab('login');
  }
</script>
</body>
</html>
